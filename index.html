<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Bullseye Blitz: a 3D paintball sniper game. Splat the bullseyes, dodge the ones with your face on them, and clear all five worlds.">
  <title>Bullseye Blitz</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- First-time setup -->
    <section id="screen-setup" class="screen">
      <div class="panel setup">
        <div class="logo"><img src="assets/icon.svg" alt=""><h1>Bullseye <span>Blitz</span></h1></div>
        <p class="sub">New player</p>
        <label class="field">
          <span>Name</span>
          <input id="setup-name" maxlength="16" placeholder="Player" autocomplete="off">
        </label>
        <div class="gender-pick">
          <button class="gender-card" data-gender="male"><div class="avatar-box" id="prev-male"></div><span>Male</span></button>
          <button class="gender-card" data-gender="female"><div class="avatar-box" id="prev-female"></div><span>Female</span></button>
        </div>
        <button id="setup-go" class="btn primary big" disabled>Start</button>
        <button id="setup-cancel" class="link-btn" hidden>Cancel</button>
      </div>
    </section>

    <!-- Home -->
    <section id="screen-home" class="screen">
      <header class="topbar">
        <div class="coin-pill"><span class="coin"></span><b data-coins>0</b></div>
        <div class="topbar-right">
          <button class="btn small secondary" id="btn-players">Players</button>
          <button class="icon-btn" id="btn-help" aria-label="How to play">?</button>
          <button class="icon-btn" id="btn-mute" aria-label="Toggle sound">🔊</button>
        </div>
      </header>
      <div id="home-msg" class="home-msg" hidden></div>
      <div class="home-main">
        <div class="home-left">
          <h1 class="title">Bullseye <span>Blitz</span></h1>
          <div class="avatar-stage">
            <div id="home-avatar" class="avatar-box big"></div>
            <div class="player-name" id="home-name"></div>
          </div>
          <button class="btn secondary" id="btn-shop">Avatar Shop</button>
        </div>
        <div class="home-right panel">
          <h2>Difficulty</h2>
          <div class="diff-row" id="diff-row"></div>
          <h2>World</h2>
          <div class="world-list" id="world-list"></div>
          <button class="btn primary big" id="btn-play">Play</button>
        </div>
      </div>
      <footer class="home-foot"><button class="link-btn" id="btn-reset">Delete this player</button></footer>
    </section>

    <!-- Game -->
    <section id="screen-game" class="screen" data-world="1">
      <div class="hud">
        <div class="hud-world"><small id="hud-world-num">World 1</small><b id="hud-world-name"></b></div>
        <div class="hud-score">
          <div class="bar"><div class="bar-fill" id="hud-bar"></div></div>
          <span id="hud-score">0 / 100</span>
        </div>
        <div class="hud-right">
          <div class="coin-pill small"><span class="coin"></span><b data-coins>0</b></div>
          <button class="icon-btn" id="btn-pause" aria-label="Pause">❚❚</button>
        </div>
      </div>
      <div id="arena" class="arena">
        <!-- The 3D view's canvas is added here by game.js. -->
        <div id="fx" class="fx"></div>
        <div class="scope" aria-hidden="true"></div>
        <div class="crosshair" aria-hidden="true"></div>
        <div id="aim-hint" class="aim-hint" hidden></div>
        <div class="touch-controls">
          <button class="touch-btn" id="btn-scope" aria-label="Scope">🔭</button>
          <button class="touch-btn fire" id="btn-fire" aria-label="Shoot">Fire</button>
        </div>
      </div>
    </section>

    <!-- Avatar shop -->
    <section id="screen-shop" class="screen">
      <header class="topbar">
        <button class="btn small secondary" id="btn-shop-back">← Back</button>
        <h2>Avatar Shop</h2>
        <div class="coin-pill"><span class="coin"></span><b data-coins>0</b></div>
      </header>
      <div class="shop-main">
        <div class="shop-preview panel"><div id="shop-avatar" class="avatar-box big"></div></div>
        <div class="shop-browse">
          <div class="tabs" id="shop-tabs"></div>
          <div class="item-grid" id="shop-grid"></div>
        </div>
      </div>
    </section>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/gear.js"></script>
  <script src="js/vendor/three.min.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
